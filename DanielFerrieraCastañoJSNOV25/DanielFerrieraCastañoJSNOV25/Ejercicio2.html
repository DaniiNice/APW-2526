<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina</title>
</head>
<body>
    <script>
        // Funciones-Leer
        function adivinaNumero() {
            let rand, num2, num = parseInt(prompt("Ingresa un número"));
            if (num < 0) {
                alert("Error: Debe ser mayor o igual a 0");
            } else {
            rand = Math.floor(Math.random() * 4);
            for (let i = 0; i <= 5; i++) {
                num2 = prompt("Adivina el número aleatorio entre 0 y " + num);
                if (num2 == rand) {
                    alert("¡Correcto! Felicidades");
                    break;
                } else if (num2 > rand) {
                    alert("Muy alto");
                } else if (num2 < rand) {
                    alert("Muy bajo");
                }
                if (i >= 4) {
                    alert("Intentos acabados");
                    break;
                }
                }
            }
        }
        // Calcular-Mostrar Resultados
        adivinaNumero();
    </script>
</body>
</html>
