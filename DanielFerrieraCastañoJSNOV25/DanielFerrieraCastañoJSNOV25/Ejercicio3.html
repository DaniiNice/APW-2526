<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificar</title>
</head>
<body>
    <script>
        // Funciones-Leer
        function clasificarCuadrilatero() {
            let num1, num2, num3, num4;
            do {
                num1 = parseInt(prompt("Ingrese una longitud"));
                 if (num1 <= 0) {
                    alert("Error: Tiene que ser mayor a 0");
                } 
            } while (num1 <= 0);
            
            do {
                num2 = parseInt(prompt("Ingrese otra longitud")); 
                if (num2 <= 0) {
                    alert("Error: Tiene que ser mayor a 0");
                } 
            } while (num2 <= 0);
            
            do {
                num3 = parseInt(prompt("Ingrese la penultima longitud"));
                 if (num3 <= 0) {
                    alert("Error: Tiene que ser mayor a 0");
                } 
            } while (num3 <= 0);
            
            do {
                num4 = parseInt(prompt("Ingrese la ultima longitud"));
                 if (num4 <= 0) {
                    alert("Error: Tiene que ser mayor a 0");
                } 
            } while (num4 <= 0);
            if (num1 == num2 == num3 == num4) {
                document.write("Es un Cuadrado");
            } else if (num1 == num3 && num2 == num4) {
                document.write("Es un Rectángulo");
            } else if (num1 < num2) {
                document.write("Es un Rombo");
            } else {
                document.write("Otro: Cualquier cuadrilátero que no cumple con las condiciones");
            }
        }
        // Calcular-Mostrar Resultados
        clasificarCuadrilatero();
    </script>
</body>
</html>
