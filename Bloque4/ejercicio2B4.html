<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse</title>
</head>
<body>
    <table border="1">
        <tr>
            <td onmouseover="Casilla(this, '#ff0000')" onmouseout="Casilla(this, '#ffffff')">
                <a href="http://www.gmail.com" style="text-decoration: none;">Gmail</a>
            </td>
        </tr> 
        <tr>
            <td onmouseover="Casilla(this, '#00ff00')" onmouseout="Casilla(this, '#ffffff')">
                <a href="http://www.outlook.com" style="text-decoration: none;">Hotmail</a>
            </td>
        </tr>
        <tr>
            <td onmouseover="Casilla(this, '#0000ff')" onmouseout="Casilla(this, '#ffffff')">
                <a href="http://www.yahoo.com" style="text-decoration: none;">Yahoo</a>
            </td>
        </tr>
    </table>
    <script src="JS/2.js"></script>
</body>
</html>
