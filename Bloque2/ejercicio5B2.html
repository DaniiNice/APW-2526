<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Datos</title>
</head>
<body>
    <script>
        // Funciones-Leer
        function procesarCenso () {
            let total = 0;
            let varones = 0;
            let mujeres = 0;
            let varonesActivos = 0;
            let documento;
            do { 
                documento = prompt('Ingresa el número de documento (0 para terminar)');
                if (documento != '0') {
                    let sexo = prompt('Ingresa el sexo (M/F):');
                    let edad = parseInt(prompt('Ingresa la edad:'));
                    total++;
                    if (sexo.toUpperCase() === 'M') {
                        varones++;
                        if (edad >= 16 && edad <= 65) {
                            varonesActivos++;
                        }
                    } else if (sexo.toUpperCase() === 'F') {
                        mujeres++;
                    } else {
                        document.write('Sexo no válido. Por favor ingresa M o F.');
                    }
                } 
            } while (documento != '0');
            document.write("Cantidad total de personas censadas: " + total + "<br>");
            document.write("Cantidad de varones: " + varones + "<br>");
            document.write("Cantidad de mujeres: " + mujeres + "<br>");
            document.write("Cantidad de varones entre 16 y 65 años: " + varonesActivos + "<br>");
        }
        // Calcular-Mostrar Resultados
        procesarCenso();
    </script>
</body>
</html>
