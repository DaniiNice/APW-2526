<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametros Num Menor</title>
</head>
<body>
    <script>
        // Funciones
        function numMenor (a, b, c) {
            let menor;
            if (a < b && a < c) {
                menor = a;
            } else if (b < a && b < c) {
                menor = b;
            } else {
                menor = c;
            }
            document.write("El número menor es: " + menor);
        }
        // Leer
        let n1 = parseInt(prompt("Ingrese el primer número:"));
        let n2 = parseInt(prompt("Ingrese el segundo número:"));
        let n3 = parseInt(prompt("Ingrese el tercer número:"));
        // Calcular-Mostrar Resultados
        numMenor(n1, n2, n3);
    </script>
</body>
</html>
