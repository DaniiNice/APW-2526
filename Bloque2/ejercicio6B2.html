<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
</head>
<body>
    <script>
        // Funciones
        function tablaMultiplicar(num) {
            let resultado = "";
            if (num >= 1 && num <= 10) {
                for (let i = 1; i <= 12; i++) {
                    resultado += num + ' x ' + i + ' = ' + (num * i) + '<br>';
                }
            } else {
                resultado = 'Error: el número debe estar entre 1 y 10.';
            }
            return resultado;
        }
        // Leer
        let num = parseInt(prompt("Ingrese un número del 1 al 10:"));
        // Calcular-Mostrar Resultados
        document.write(tablaMultiplicar(num));
    </script>
</body>
</html>
