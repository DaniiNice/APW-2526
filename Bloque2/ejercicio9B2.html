<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametros Cuadrado</title>
</head>
<body>
    <script>
        // Funciones
        function perimetroCuadrado (lado) {
            return 4 * lado;
        }
        // Leer
        let ladoCuadrado = parseFloat(prompt("Ingrese el valor del lado del cuadrado:"));
        let perimetro = perimetroCuadrado(ladoCuadrado);
        // Calcular-Mostrar Resultados
        document.write("El perímetro del cuadrado es: " + perimetro);
    </script>
</body>
</html>
