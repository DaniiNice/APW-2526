<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplos</title>
</head>
<body>
    <script>
        // Funciones
        function hacerMultiplos() {
            for (let i = 8; i < 500; i += 8) {
                document.write("-" + i + '<br>');
            }
        }
        hacerMultiplos();
    </script>
</body>
</html>
