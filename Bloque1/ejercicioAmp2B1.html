<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NumRomano</title>
</head>
<body>
    <script>
        // Funciones
        function convertirARomano(numero) {
            let romano;
            switch (numero) {
                case 1: romano = "I"; break;
                case 2: romano = "II"; break;
                case 3: romano = "III"; break;
                case 4: romano = "IV"; break;
                case 5: romano = "V"; break;
                case 6: romano = "VI"; break;
                case 7: romano = "VII"; break;
                case 8: romano = "VIII"; break;
                case 9: romano = "IX"; break;
                case 10: romano = "X"; break;
                }
            return romano;
        }
        // Leer
        let numero = parseInt(prompt("Ingrese un número entero entre 1 y 10:"));
        while (numero < 1 || numero > 10) {
            numero = parseInt(prompt("Error: Ingrese un número válido entre 1 y 10:"));
        }
        // Calcular-Mostrar resultados
        let resultado = convertirARomano(numero);
        document.write("El número " + numero + " en números romanos es: " + resultado);
    </script>
</body>
</html>
