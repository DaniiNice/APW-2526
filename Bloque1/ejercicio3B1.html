<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrado</title>
</head>
<body>
    <script>
        // Leer
        let lado, perimetro;
        lado = parseFloat(prompt('Ingrese el valor del lado del cuadrado:'));
        // Calcular
        perimetro = lado * 4;
        // Mostrar resultados
        document.write('El perímetro del cuadrado es: ' + perimetro);
    </script>
</body>
</html>
