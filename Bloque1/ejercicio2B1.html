<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail</title>
</head>
<body>
    <script>
        // Leer
        let nombre, mail;
        nombre = prompt('Introduzca su usuario');
        mail = prompt('Introduzca su mail');
        // Mostrar resultados
        document.write('Nombre: ' + nombre);
        document.write('<br>');
        document.write('Mail: ' + mail);
    </script>
</body>
</html>
