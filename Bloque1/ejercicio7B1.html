<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiElse</title>
</head>
<body>
    <script>
        // Leer
        let num1, num2, suma, dif, produc, divi;
        num1 = parseFloat(prompt('Ingrese un número'));
        num2 = parseFloat(prompt('Ingrese otro número'));
        // Calcular-Mostrar resultados
        if (num1 > num2) {
            document.write('El mayor es: ' + num1);
            document.write('<br>');
            suma = num1 + num2;
            dif = num1 - num2;
            document.write('La suma es: ' + suma);
            document.write('<br>');
            document.write('La diferencia es: ' + dif);
        } else {
            document.write('El mayor es: ' + num2);
            document.write('<br>');
            produc = num1 * num2;
            divi = num1 / num2;
            document.write('El producto es: ' + produc);
            document.write('<br>');
            document.write('La división es: ' + divi);
        }
    </script>
</body>
</html>
