<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dígitos</title>
</head>
<body>
    <script>
        // Leer el número y convertirlo a entero
        let numero = parseInt(prompt("Ingrese un número positivo (1 a 99):"));
        // Calcular-Mostrar resultados
        if (numero < 1 || numero > 99) {
            document.write("El número ingresado está fuera del rango (1 a 99).");
            } else {
        if (numero < 10) {
            document.write("El número tiene un solo dígito.");
            } else {
                document.write("El número tiene dos dígitos.");
            }
        }
    </script>
</body>
</html>
