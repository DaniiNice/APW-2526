<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagar</title>
</head>
<body>
    <script>
        // Leer
        let precio, cantidad, total;
        precio = parseInt(prompt('Ingrese el precio del artículo (entero):'));
        cantidad = parseInt(prompt('Ingrese la cantidad que lleva el cliente (entero):'));
        // Calcular
        total = precio * cantidad;
        // Mostrar resultados
        document.write('El total a abonar es: ' + total);
    </script>
</body>
</html>
