<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña</title>
</head>
<body>
    <script>
        // Leer
        let contra1, contra2;
        contra1 = prompt('Ingrese una contraseña:'); 
        contra2 = prompt('Repita la contraseña:');  
        // Calcular-Mostrar resultados
        if (contra1 == contra2) {
            document.write('Las contraseñas son iguales');
        } else {
            document.write('Las contraseñas son diferentes');
        }
    </script>
</body>
</html>
