<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos</title>
</head>
<body>
    <script>
        // Leer
        let nombre, edad;
        nombre = prompt('Introduzca su nombre');
        edad = parseInt(prompt('Introduzca su edad'));
        // Mostrar resultados
        document.write('Nombre: ' + nombre);
        document.write('<br>');
        document.write('Edad: ' + edad);
    </script>
</body>
</html>
