<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Bucle</title>
</head>
<body>
    <script>
        // Leer
        let nota, promedio, cont, acu;
        cont = 1;
        acu = 0;
        // Calcular-Mostrar resultados
        while (cont <= 3) {
            nota = parseFloat(prompt('Ingrese la nota ' + cont + ':'));
            acu = acu + nota;
            cont = cont + 1;
        } 
        promedio = acu / 3;
        if (promedio >= 4) {
            document.write('Regular');
        } else {
            document.write('Reprobado');
        }
    </script>
</body>
</html>
