<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
</head>
<body>
    <script>
        function procesarString() {
        let texto = prompt("Ingrese un texto");
        let mitad = texto.length / 2;
        document.write("Primera mitad: " + texto.substring(0, mitad) + "<br>");
        document.write("Último carácter: " + texto.charAt(texto.length - 1) + "<br>");
        document.write("Invertido: " + texto.split("").reverse().join("") + "<br>");
        document.write("Separado por guiones: " + texto.split("").join("-") + "<br>");
        let vocales = 0;
        for (let i = 0; i < texto.length; i++) {
            if ("aeiouAEIOU".includes(texto[i])) {
                vocales++;
            }
        }
        document.write("Cantidad de vocales: " + vocales);
        }
        procesarString();
    </script>
</body>
</html>
